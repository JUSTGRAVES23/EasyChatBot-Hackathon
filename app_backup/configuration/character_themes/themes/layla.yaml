# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: layla
name: Layla
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: curious_guide
  visual_personality: quiet_moroccan_guide
  signature: curiosity

palette:
  primary: "#9B3328"
  secondary: "#C9964A"
  accent: "#B86F4A"
  background: "#F5E8D7"
  surface: "#FFF9F1"
  surface_alt: "#EAD5BB"
  text_primary: "#302521"
  text_secondary: "#6B574A"
  highlight: "#E4B96C"

atmosphere:
  mood: intimate
  energy: low_medium
  warmth: warm_reserved
  style: moroccan_riad
  decorative_elements:
    - zellige_patterns
    - brass_lanterns
    - arches
    - woven_textiles
    - olive_branches

character:
  portrait_asset: layla
  hero_emphasis: high
  signature_detail: quiet_confidence
  expressions: [gentle, thoughtful, curious, amused, direct]

dashboard:
  hero_style: character_led
  mission_style: cultural_discovery
  recommendation_style: curated_culture
  notification_style: warm_lantern
  quote_style: thoughtful
  animation_intensity: low_medium
  animations: [lantern_flicker, subtle_parallax, plant_motion]

worlds:
  morocco:
    environment: moroccan_riad
    landmark: koutoubia_mosque
    background_mood: warm_moroccan
    decorative_elements: [koutoubia_mosque, medina, zellige, lanterns]
  france:
    environment: parisian_quiet_quarter
    landmark: eiffel_tower
    background_mood: warm_european
    decorative_elements: [eiffel_tower, cafe, books]
  spain:
    environment: spanish_quiet_quarter
    landmark: sagrada_familia
    background_mood: warm_european
    decorative_elements: [sagrada_familia, cafe, books]
