# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: julie
name: Julie
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: wise_guide
  visual_personality: gentle_storyteller
  signature: patience

palette:
  primary: "#8A668C"
  secondary: "#C7A9C8"
  accent: "#A47AA6"
  background: "#FAF5FB"
  surface: "#FFFFFF"
  surface_alt: "#F0E7F1"
  text_primary: "#302633"
  text_secondary: "#6C5B70"
  highlight: "#E4D2E5"

atmosphere:
  mood: gentle
  energy: low_medium
  warmth: very_high
  style: soft_storytelling
  decorative_elements:
    - flowers
    - books
    - soft_stars
    - warm_lamps
    - delicate_line_art

character:
  portrait_asset: julie
  hero_emphasis: high
  signature_detail: gentle_presence
  expressions: [warm, thoughtful, reassuring, amused, proud]

dashboard:
  hero_style: character_led
  mission_style: gentle_journey
  recommendation_style: thoughtful
  notification_style: warm
  quote_style: encouraging
  animation_intensity: low
  animations: [soft_glow, floating_petal, gentle_parallax]

worlds:
  france:
    environment: parisian_garden
    landmark: eiffel_tower
    background_mood: soft_paris
    decorative_elements: [eiffel_tower, garden, books, cafe]
  spain:
    environment: spanish_garden
    landmark: sagrada_familia
    background_mood: warm_spain
    decorative_elements: [sagrada_familia, garden, books]
