# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: antoine
name: Antoine
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: wise_guide
  visual_personality: refined_storyteller
  signature: patience

palette:
  primary: "#6E4B3A"
  secondary: "#B98B6A"
  accent: "#C79A62"
  background: "#F8F2EA"
  surface: "#FFFFFF"
  surface_alt: "#EFE3D5"
  text_primary: "#30241E"
  text_secondary: "#6C5A4E"
  highlight: "#E6C99F"

atmosphere:
  mood: reflective
  energy: medium
  warmth: high
  style: warm_storytelling
  decorative_elements:
    - books
    - parchment
    - cafe_lamps
    - subtle_architecture
    - handwritten_lines

character:
  portrait_asset: antoine
  hero_emphasis: high
  signature_detail: calm_presence
  expressions: [thoughtful, amused, patient, confident, reflective]

dashboard:
  hero_style: character_led
  mission_style: story_journey
  recommendation_style: curated_storytelling
  notification_style: calm
  quote_style: reflective
  animation_intensity: low
  animations: [soft_light_shift, page_turn, gentle_parallax]

worlds:
  france:
    environment: parisian_quarter
    landmark: eiffel_tower
    background_mood: literary_paris
    decorative_elements: [eiffel_tower, old_streets, books, cafe]
  spain:
    environment: spanish_historic_quarter
    landmark: sagrada_familia
    background_mood: literary_spain
    decorative_elements: [sagrada_familia, old_streets, books]
