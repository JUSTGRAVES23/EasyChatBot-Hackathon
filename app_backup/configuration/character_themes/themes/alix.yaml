# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: alix
name: Alix
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: energetic_teacher
  visual_personality: energetic_parisian
  signature: positivity

palette:
  primary: "#E83E8C"
  secondary: "#F7A8C8"
  accent: "#FF4F9A"
  background: "#FFF7FB"
  surface: "#FFFFFF"
  surface_alt: "#FCEAF3"
  text_primary: "#30212A"
  text_secondary: "#735564"
  highlight: "#FFD1E4"

atmosphere:
  mood: energetic
  energy: high
  warmth: high
  style: bright_french_editorial
  decorative_elements:
    - pink_blossoms
    - soft_sparkles
    - parisian_line_art
    - cafe_details
    - subtle_pink_glow

character:
  portrait_asset: alix
  hero_emphasis: high
  signature_detail: pink_cast
  expressions:
    - energetic
    - encouraging
    - joyful
    - proud
    - playful

dashboard:
  hero_style: character_led
  mission_style: energetic_challenge
  recommendation_style: friendly_discovery
  notification_style: cheerful_but_clear
  quote_style: motivational
  animation_intensity: medium
  animations:
    - soft_sparkle
    - gentle_parallax
    - subtle_pink_glow

worlds:
  france:
    environment: paris
    landmark: eiffel_tower
    background_mood: parisian_daylight
    decorative_elements: [eiffel_tower, paris_rooftops, cafe, pink_blossoms]
  spain:
    environment: spanish_city
    landmark: sagrada_familia
    background_mood: warm_spanish_daylight
    decorative_elements: [sagrada_familia, spanish_rooftops, cafe, warm_sun]
  luxembourg:
    environment: luxembourg_city
    landmark: old_quarter
    background_mood: elegant_city_daylight
    decorative_elements: [old_quarter, stone_architecture, city_gardens]
