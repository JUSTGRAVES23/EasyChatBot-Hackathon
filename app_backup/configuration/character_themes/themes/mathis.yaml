# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: mathis
name: Mathis
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: coach
  visual_personality: high_energy_challenger
  signature: action

palette:
  primary: "#E46A32"
  secondary: "#F2A36E"
  accent: "#FF7B39"
  background: "#FFF7F1"
  surface: "#FFFFFF"
  surface_alt: "#FCE9DC"
  text_primary: "#38251E"
  text_secondary: "#76594C"
  highlight: "#FFD0B3"

atmosphere:
  mood: energetic
  energy: very_high
  warmth: medium
  style: action_coach
  decorative_elements:
    - motion_lines
    - challenge_badges
    - arrows
    - dynamic_shapes
    - achievement_sparks

character:
  portrait_asset: mathis
  hero_emphasis: high
  signature_detail: action
  expressions: [energetic, determined, playful, competitive, proud]

dashboard:
  hero_style: character_led
  mission_style: challenge
  recommendation_style: action_oriented
  notification_style: energetic
  quote_style: motivational
  animation_intensity: high
  animations: [bounce, motion_lines, achievement_burst, dynamic_parallax]

worlds:
  france:
    environment: paris_active_day
    landmark: eiffel_tower
    background_mood: energetic_paris
    decorative_elements: [eiffel_tower, motion_lines, city_sun]
  spain:
    environment: spanish_active_day
    landmark: sagrada_familia
    background_mood: energetic_spain
    decorative_elements: [sagrada_familia, motion_lines, warm_sun]
