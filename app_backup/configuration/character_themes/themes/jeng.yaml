# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: jeng
name: Jeng
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: mountain_explorer
  visual_personality: sunny_adventurer
  signature: loyalty

palette:
  primary: "#4E8C68"
  secondary: "#8CC39D"
  accent: "#E5A93D"
  background: "#F5FBF6"
  surface: "#FFFFFF"
  surface_alt: "#E7F3E9"
  text_primary: "#24352B"
  text_secondary: "#5A7062"
  highlight: "#F5D58D"

atmosphere:
  mood: adventurous
  energy: medium_high
  warmth: high
  style: sunny_alpine
  decorative_elements:
    - mountain_lines
    - compass
    - alpine_flowers
    - sun_rays
    - expedition_marks

character:
  portrait_asset: jeng
  hero_emphasis: high
  signature_detail: natural_explorer_identity
  expressions: [warm, adventurous, determined, playful, curious]

dashboard:
  hero_style: character_led
  mission_style: mountain_expedition
  recommendation_style: discovery
  notification_style: expedition_alert
  quote_style: courageous
  animation_intensity: medium
  animations: [cloud_motion, grass_motion, sunlight_shift, compass_rotation]

worlds:
  sunny_mountains:
    environment: sunny_alpine_mountains
    landmark: mountain_summit
    background_mood: clear_sunlit_mountains
    decorative_elements: [green_slopes, rocky_peaks, pine_forest, clear_sky]
  france:
    environment: french_alps
    landmark: mont_blanc
    background_mood: sunny_alpine
    decorative_elements: [mont_blanc, alpine_meadow, mountain_trail]

rivalry:
  rival: yeti
  type: arch_enemy
  visual_contrast: sunlit_mountains_vs_snowy_mountains
