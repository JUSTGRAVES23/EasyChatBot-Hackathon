# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: grinch
name: Grinch
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: mischievous_friend
  visual_personality: scary_mischievous
  signature: sarcasm

palette:
  primary: "#B5122B"
  secondary: "#5A0D18"
  accent: "#E22A3F"
  background: "#180D12"
  surface: "#281118"
  surface_alt: "#3A151F"
  text_primary: "#FFF4F5"
  text_secondary: "#D9AEB5"
  highlight: "#FF465A"

atmosphere:
  mood: mischievous
  energy: medium
  warmth: selective
  style: cinematic_red_shadow
  decorative_elements:
    - red_glow
    - sharp_line_art
    - dark_spark
    - mischievous_symbols
    - subtle_shadow_shapes

character:
  portrait_asset: grinch
  hero_emphasis: high
  signature_detail: intimidating_playfulness
  expressions: [smirk, skeptical, mischievous, amused, challenging]

dashboard:
  hero_style: character_led
  mission_style: mischievous_challenge
  recommendation_style: unexpected_pick
  notification_style: dramatic
  quote_style: sarcastic
  animation_intensity: medium
  animations: [red_glow_pulse, shadow_shift, sharp_spark]

worlds:
  france:
    environment: mysterious_paris
    landmark: eiffel_tower
    background_mood: cinematic_red_paris
    decorative_elements: [eiffel_tower, red_lighting, dark_rooftops]
  spain:
    environment: mysterious_spain
    landmark: sagrada_familia
    background_mood: cinematic_red_spain
    decorative_elements: [sagrada_familia, red_lighting, dark_rooftops]
