# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: adri
name: Adri
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: explorer
  visual_personality: adventurous_cultural_explorer
  signature: discovery

palette:
  primary: "#5E9B70"
  secondary: "#9FC9A8"
  accent: "#4F8C63"
  background: "#F4FAF4"
  surface: "#FFFFFF"
  surface_alt: "#EAF5EC"
  text_primary: "#24372A"
  text_secondary: "#557060"
  highlight: "#D8EBD9"

atmosphere:
  mood: adventurous
  energy: medium_high
  warmth: high
  style: green_explorer
  decorative_elements:
    - maps
    - compass_marks
    - travel_stamps
    - botanical_line_art
    - route_lines

character:
  portrait_asset: adri
  hero_emphasis: high
  signature_detail: adri_green
  expressions: [curious, adventurous, amused, surprised, confident]

dashboard:
  hero_style: character_led
  mission_style: expedition
  recommendation_style: cultural_discovery
  notification_style: travel_alert
  quote_style: exploratory
  animation_intensity: medium
  animations: [route_draw, subtle_leaf_motion, gentle_parallax]

worlds:
  france:
    environment: paris
    landmark: eiffel_tower
    background_mood: european_exploration
    decorative_elements: [eiffel_tower, map_lines, cafe]
  spain:
    environment: spanish_city
    landmark: sagrada_familia
    background_mood: warm_exploration
    decorative_elements: [sagrada_familia, map_lines, plaza]
  morocco:
    environment: moroccan_city
    landmark: koutoubia_mosque
    background_mood: warm_cultural_exploration
    decorative_elements: [koutoubia_mosque, medina_arches, map_lines]
