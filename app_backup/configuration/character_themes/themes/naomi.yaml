# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: naomi
name: Naomi
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: creative_companion
  visual_personality: imaginative_storyteller
  signature: imagination

palette:
  primary: "#C45A9A"
  secondary: "#E2A2C8"
  accent: "#D97AB0"
  background: "#FFF7FC"
  surface: "#FFFFFF"
  surface_alt: "#F7E8F1"
  text_primary: "#352331"
  text_secondary: "#76566A"
  highlight: "#F2C9DE"

atmosphere:
  mood: imaginative
  energy: medium_high
  warmth: high
  style: creative_storybook
  decorative_elements:
    - doodles
    - stars
    - sketch_lines
    - paper_shapes
    - creative_symbols

character:
  portrait_asset: naomi
  hero_emphasis: high
  signature_detail: creative_presence
  expressions: [curious, imaginative, amused, inspired, playful]

dashboard:
  hero_style: character_led
  mission_style: creative_quest
  recommendation_style: artistic_discovery
  notification_style: playful
  quote_style: imaginative
  animation_intensity: medium
  animations: [doodle_draw, floating_shapes, soft_sparkle]

worlds:
  france:
    environment: creative_paris
    landmark: eiffel_tower
    background_mood: artistic_paris
    decorative_elements: [eiffel_tower, sketches, cafe, flowers]
  spain:
    environment: creative_barcelona
    landmark: sagrada_familia
    background_mood: artistic_spain
    decorative_elements: [sagrada_familia, sketches, plaza, flowers]
  morocco:
    environment: creative_marrakech
    landmark: koutoubia_mosque
    background_mood: artistic_morocco
    decorative_elements: [koutoubia_mosque, patterns, textiles, sketches]
