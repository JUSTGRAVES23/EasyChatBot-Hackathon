# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: yeti
name: Yeti
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: storyteller
  visual_personality: magical_snow_mountain_storyteller
  signature: wonder

palette:
  primary: "#5E91B8"
  secondary: "#A8D0E8"
  accent: "#78B9DC"
  background: "#F2F9FD"
  surface: "#FFFFFF"
  surface_alt: "#E1F0F8"
  text_primary: "#203542"
  text_secondary: "#5A7482"
  highlight: "#D7F0FF"

atmosphere:
  mood: magical
  energy: medium
  warmth: medium
  style: snowy_wonder
  decorative_elements:
    - snowflakes
    - mountain_lines
    - stars
    - soft_ice_shapes
    - storybook_marks

character:
  portrait_asset: yeti
  hero_emphasis: high
  signature_detail: friendly_yeti_presence
  expressions: [wonder, playful, curious, amused, surprised]

dashboard:
  hero_style: character_led
  mission_style: story_adventure
  recommendation_style: wonder_discovery
  notification_style: snowy_magic
  quote_style: storytelling
  animation_intensity: medium
  animations: [snow_drift, star_twinkle, soft_cloud_motion, gentle_parallax]

worlds:
  snowy_mountains:
    environment: snowy_mountain_world
    landmark: snow_capped_summit
    background_mood: magical_snow
    decorative_elements: [snowy_peaks, winter_forest, snowflakes, stars]
  france:
    environment: winter_paris
    landmark: eiffel_tower
    background_mood: magical_winter_paris
    decorative_elements: [eiffel_tower, snowflakes, winter_lights]

rivalry:
  rival: jeng
  type: arch_enemy
  visual_contrast: snowy_mountains_vs_sunlit_mountains
