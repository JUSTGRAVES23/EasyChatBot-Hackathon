name: EasyChatBot CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:

  backend-import-boundary:
    name: Backend Import Boundary
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify backend package resolution
        working-directory: backend
        run: |
          python -c "import app; print('BACKEND APP:', app.__file__)"
          python -c "from app.application.academy.academy_activation import AcademyActivationConfig; print('ACADEMY IMPORT: OK')"

      - name: Run import boundary regression tests
        run: |
          python -m pytest backend/tests/infrastructure/test_backend_import_boundary.py -q

      - name: Run backend regression suite
        run: |
          python -m pytest backend/tests -q


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build