# Live Intelligence Agent Manifest
#
# Purpose:
# Defines the operational identity, capabilities and constraints
# of the Live Intelligence Agent.
#
# Architecture:
# AI Runtime -> Agent Manifest -> Agent Handler -> Provider Layer
#
# This agent must remain:
# - stateless where practical
# - provider independent
# - controlled by Runtime policies
# - unable to create uncontrolled side effects

agent:
  id: live_intelligence_agent
  name: Live Intelligence Agent
  version: "1.0.0"

  description: >
    Research-oriented AI agent that gathers external information,
    structures knowledge, and prepares learning intelligence outputs.

purpose:
  primary: >
    Transform external information into structured intelligence
    suitable for educational challenge generation.

  use_cases:
    - current_events_research
    - topic_exploration
    - learning_content_preparation
    - vocabulary_context_generation

capabilities:
  enabled:
    - web_research
    - information_extraction
    - source_structuring
    - knowledge_summarisation

  disabled:
    - autonomous_actions
    - external_system_modification
    - content_publishing
    - production_configuration_changes

inputs:
  schema:
    topic:
      type: string
      required: true

    language:
      type: string
      required: false
      default: "French"

    learner_level:
      type: string
      required: false
      default: "B2"

outputs:
  schema:
    research_summary:
      type: string

    sources:
      type: array

    key_information:
      type: array

    learning_context:
      type: object

providers:
  required:
    - search_provider

  optional:
    - llm_provider

runtime_policy:
  execution_mode: controlled

  permissions:
    read_external_information: true
    write_application_data: false
    modify_configuration: false
    execute_external_actions: false

security:
  data_handling:
    collect_personal_data: false

  restrictions:
    - no_direct_provider_bypass
    - no_hidden_external_calls
    - no_unapproved_actions

observability:
  logging:
    enabled: true

  metrics:
    - execution_time
    - provider_calls
    - success_rate
    - failure_rate

testing:
  required:
    - manifest_validation
    - unit_tests
    - provider_contract_tests