<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>
        EasyChatBot AI Companion
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="container">


    <header>

        <h1>
            EasyChatBot
        </h1>


        <h2>
            Your Forever Learning Companion
        </h2>


        <p>
            Learn, explore and grow with AI companions
            that stay with you throughout your journey.
        </p>

    </header>



    <section class="character">


        <h3>
            Choose your AI companion
        </h3>


        <div id="characters">

            <!-- Characters loaded dynamically -->

        </div>


        <p id="selected-character">

            Selected companion: Yeti

        </p>


    </section>




    <section class="chat">


        <h3>
            Start a conversation
        </h3>


        <textarea
            id="message"
            placeholder="Ask your companion anything..."
        ></textarea>



        <div class="options">


            <label>

                <input
                    type="checkbox"
                    id="research"
                >

                Use real-world knowledge

            </label>


        </div>




        <button
            type="button"
            onclick="sendMessage()"
        >

            Send Message

        </button>



    </section>




    <section class="result">


        <h3>
            EasyChatBot Response
        </h3>


        <pre id="response">Your companion response will appear here...</pre>


    </section>


</div>



<script src="characters.js"></script>

<script src="app.js"></script>


</body>

</html>
