# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: luminate
name: Luminate
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: visionary
  visual_personality: futuristic_mentor
  signature: innovation

palette:
  primary: "#6E55C9"
  secondary: "#9D87F0"
  accent: "#B59CFF"
  background: "#11152D"
  surface: "#1A2040"
  surface_alt: "#252B50"
  text_primary: "#F8F7FF"
  text_secondary: "#BFC1DA"
  highlight: "#D6CCFF"

atmosphere:
  mood: visionary
  energy: medium
  warmth: medium_high
  style: futuristic_educational
  decorative_elements:
    - constellations
    - glowing_lines
    - abstract_orbits
    - soft_neon
    - innovation_symbols

character:
  portrait_asset: luminate
  hero_emphasis: high
  signature_detail: luminous_presence
  expressions: [thoughtful, visionary, curious, confident, inspired]

dashboard:
  hero_style: character_led
  mission_style: future_challenge
  recommendation_style: intelligent_curated
  notification_style: luminous
  quote_style: visionary
  animation_intensity: medium
  animations: [orbit_motion, star_twinkle, soft_glow, slow_parallax]

worlds:
  france:
    environment: futuristic_paris
    landmark: eiffel_tower
    background_mood: luminous_paris
    decorative_elements: [eiffel_tower, light_lines, stars]
  spain:
    environment: futuristic_barcelona
    landmark: sagrada_familia
    background_mood: luminous_spain
    decorative_elements: [sagrada_familia, light_lines, stars]
  professional:
    environment: innovation_lab
    landmark: innovation_hub
    background_mood: visionary_future
    decorative_elements: [data_lines, constellations, abstract_architecture]
