# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: nora
name: Nora
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: strategic_companion
  visual_personality: intelligent_strategist
  signature: strategic_thinking

palette:
  primary: "#4D4B88"
  secondary: "#8B88C6"
  accent: "#6A67A8"
  background: "#F6F5FC"
  surface: "#FFFFFF"
  surface_alt: "#EAE9F5"
  text_primary: "#28273A"
  text_secondary: "#5F5D72"
  highlight: "#D6D3EE"

atmosphere:
  mood: strategic
  energy: medium
  warmth: medium
  style: intelligent_minimal
  decorative_elements:
    - strategy_grids
    - nodes
    - subtle_paths
    - chess_like_geometry
    - data_points

character:
  portrait_asset: nora
  hero_emphasis: high
  signature_detail: strategic_presence
  expressions: [analytical, amused, focused, confident, thoughtful]

dashboard:
  hero_style: character_led
  mission_style: strategic_problem
  recommendation_style: smart_curated
  notification_style: precise
  quote_style: strategic
  animation_intensity: low_medium
  animations: [node_pulse, path_draw, subtle_grid_motion]

worlds:
  france:
    environment: strategic_paris
    landmark: eiffel_tower
    background_mood: refined_paris
    decorative_elements: [eiffel_tower, strategy_grid, city_lines]
  spain:
    environment: strategic_spain
    landmark: sagrada_familia
    background_mood: refined_spain
    decorative_elements: [sagrada_familia, strategy_grid, city_lines]
