# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: clara
name: Clara
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: professor
  visual_personality: precise_academic
  signature: precision

palette:
  primary: "#485A8A"
  secondary: "#91A0C4"
  accent: "#6578B0"
  background: "#F5F7FC"
  surface: "#FFFFFF"
  surface_alt: "#E9EDF7"
  text_primary: "#20283A"
  text_secondary: "#59647B"
  highlight: "#D8E0F4"

atmosphere:
  mood: intellectual
  energy: low_medium
  warmth: medium
  style: modern_academic
  decorative_elements:
    - geometric_grids
    - books
    - diagrams
    - subtle_gold_lines
    - paper_texture

character:
  portrait_asset: clara
  hero_emphasis: high
  signature_detail: precision
  expressions: [focused, thoughtful, encouraging, serious, proud]

dashboard:
  hero_style: character_led
  mission_style: structured_learning
  recommendation_style: curated_advanced
  notification_style: academic
  quote_style: intellectual
  animation_intensity: low
  animations: [grid_motion, subtle_light_shift]

worlds:
  france:
    environment: paris_academic
    landmark: eiffel_tower
    background_mood: elegant_academic
    decorative_elements: [eiffel_tower, library, geometric_grid]
  spain:
    environment: spanish_academic
    landmark: sagrada_familia
    background_mood: elegant_academic
    decorative_elements: [sagrada_familia, library, geometric_grid]
