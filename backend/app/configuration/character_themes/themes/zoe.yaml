# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: zoe
name: Zoe
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: challenger
  visual_personality: competitive_energetic
  signature: challenge

palette:
  primary: "#D84F72"
  secondary: "#F09AB0"
  accent: "#E85E82"
  background: "#FFF6F8"
  surface: "#FFFFFF"
  surface_alt: "#FBE7EC"
  text_primary: "#35222A"
  text_secondary: "#76525E"
  highlight: "#FFC5D3"

atmosphere:
  mood: competitive
  energy: very_high
  warmth: medium
  style: playful_competition
  decorative_elements:
    - score_marks
    - stars
    - challenge_badges
    - motion_lines
    - playful_arrows

character:
  portrait_asset: zoe
  hero_emphasis: high
  signature_detail: challenger_energy
  expressions: [competitive, playful, determined, excited, proud]

dashboard:
  hero_style: character_led
  mission_style: competition
  recommendation_style: challenge_pick
  notification_style: energetic
  quote_style: achievement
  animation_intensity: high
  animations: [score_pulse, badge_bounce, motion_lines, sparkle_burst]

worlds:
  france:
    environment: competitive_paris
    landmark: eiffel_tower
    background_mood: energetic_paris
    decorative_elements: [eiffel_tower, challenge_badges, motion_lines]
  spain:
    environment: competitive_spain
    landmark: sagrada_familia
    background_mood: energetic_spain
    decorative_elements: [sagrada_familia, challenge_badges, motion_lines]
