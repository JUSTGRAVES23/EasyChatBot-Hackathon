# EasyChatBot Character Theme System
# Character-responsive visual configuration.
# Core UI structure, navigation, typography and EasyChatBot identity remain stable.
# Character theme controls atmosphere, accent, artwork, decoration, microcopy and animation.
id: simon
name: Simon
theme_version: "1.0"
enabled: true

branding:
  core_brand: easychatbot
  preserve_logo: true
  preserve_navigation: true
  preserve_typography: true
  preserve_core_components: true
  visual_strategy: character_responsive

identity:
  role: mentor
  visual_personality: calm_professional_mentor
  signature: clarity

palette:
  primary: "#3F6678"
  secondary: "#7FA4B4"
  accent: "#5A8394"
  background: "#F4F8FA"
  surface: "#FFFFFF"
  surface_alt: "#E5EEF2"
  text_primary: "#223039"
  text_secondary: "#586B74"
  highlight: "#C9DCE4"

atmosphere:
  mood: calm
  energy: low
  warmth: high
  style: structured_professional
  decorative_elements:
    - clean_lines
    - books
    - architectural_shapes
    - subtle_grids
    - calm_light

character:
  portrait_asset: simon
  hero_emphasis: high
  signature_detail: clarity
  expressions: [calm, thoughtful, reassuring, focused, proud]

dashboard:
  hero_style: character_led
  mission_style: structured_progress
  recommendation_style: professional_curated
  notification_style: clear
  quote_style: calm
  animation_intensity: low
  animations: [slow_light_shift, gentle_parallax]

worlds:
  france:
    environment: paris_professional
    landmark: eiffel_tower
    background_mood: elegant_paris
    decorative_elements: [eiffel_tower, architecture, clean_lines]
  spain:
    environment: spanish_professional
    landmark: sagrada_familia
    background_mood: elegant_spain
    decorative_elements: [sagrada_familia, architecture, clean_lines]
