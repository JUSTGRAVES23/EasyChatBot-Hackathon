[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "easychatbot-backend"
version = "0.1.0"
description = "EasyChatBot backend runtime"
requires-python = ">=3.13"

dependencies = [
    "pyyaml",
    "fastapi",
    "uvicorn",
]


[tool.setuptools]
packages = [
    "app",
    "app.domain",
    "app.domain.uai",
    "app.domain.uai.context",

    "app.application",
    "app.application.uai",
    "app.application.uai.world",

    "app.infrastructure",
    "app.infrastructure.worlds",

    "app.configuration",
    "app.configuration.worlds",
]